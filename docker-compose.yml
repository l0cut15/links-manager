services:
  links-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: links-manager
    ports:
      - "3003:3003"
    volumes:
      # Mount the data directory (not just links.json) so saves can be written
      # atomically via temp file + rename, which a single-file bind mount can't do
      - ./data:/app/data
      # Mount public directory so static files are served without rebuilding
      - ./public:/app/public
    environment:
      - NODE_ENV=production
    user: "1000:1000"  # Run as brettsamuel user
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/api/links', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - links-network

networks:
  links-network:
    driver: bridge
